[theme]
theme = "plain"
[theme.overrides]
idle_bg = "#00000000"
idle_fg = "#ffffff"
info_bg = "#00000000"
info_fg = "#ffffff"
good_bg = "#00000000"
good_fg = "#00ff00"
warning_bg = "#00000000"
warning_fg = "#ffff00"
critical_bg = "#00000000"
critical_fg = "#ff0000"
separator = " │ "
separator_bg = "#00000000"
separator_fg = "#808080"
start_separator = ""
end_separator = ""

[icons]
icons = "material-nf"

[[block]]
block = "net"
device = "^(w.*|e.*)$"
format = "$icon {$ssid ($signal_strength)|Wired}"
format_alt = "$icon $ip"
inactive_format = ""
missing_format = ""
interval = 5

[[block]]
block = "cpu"
format = "$icon $utilization"
interval = 5

[[block]]
block = "temperature"
format = "$icon $average"
chip = "coretemp-isa-*"
interval = 5

[[block]]
block = "memory"
format = "$icon $mem_used"
interval = 5

[[block]]
block = "backlight"
format = "$icon $brightness"
step_width = 5

[[block]]
block = "sound"
driver = "auto"
format = "$icon {$volume|}"
headphones_indicator = true
max_vol = 100
show_volume_when_muted = true
step_width = 5

[[block]]
block = "keyboard_layout"
driver = "sway"
format = "$layout"
[block.mappings]
"Ukrainian (N/A)" = "UA"
"Faroese (no dead keys)" = "FO"

[[block]]
block = "battery"
driver = "upower"
device = "DisplayDevice"
format = "$icon $percentage {($time)|}"
interval = 5

[[block]]
block = "time"
format = "$icon $timestamp.datetime(f:'%a %d/%m %R') "
interval = 60
[[block.click]]
button = "right"
cmd = "foot --title=Calendar --app-id=calendar_popup -e calcurse"
